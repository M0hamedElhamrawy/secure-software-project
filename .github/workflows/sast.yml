name: SAST - Bandit Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  bandit-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit scan
        # continue-on-error so the workflow still produces a report/artifact
        # even when Bandit finds issues (a "failed" scan is still a successful run)
        run: |
          bandit -r . -f txt -o bandit_report.txt || true
          bandit -r . -f json -o bandit_report.json || true
        continue-on-error: true

      - name: Show summary in workflow log
        run: cat bandit_report.txt

      - name: Upload Bandit report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-report
          path: |
            bandit_report.txt
            bandit_report.json
          retention-days: 30
